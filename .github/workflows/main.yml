name: Auto Build Kernel SD8150 (with KernelSU)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git

      - name: Setup KernelSU
        run: |
          if [ ! -d drivers/kernelsu ]; then
            echo "Cloning KernelSU..."
            git clone https://github.com/tiann/KernelSU.git drivers/kernelsu
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          mkdir -p out

          make O=out sd8150_perf_defconfig

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Prepare Release Files
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image* release/ || true
          ls -lh release/

      - name: Create GitHub Release (Image)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          name: SD8150 Kernel Build ${{ github.run_number }}
          body: |
            Auto-built kernel image
            Device: SD8150
            Defconfig: sd8150_perf_defconfig
            KernelSU: enabled
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
