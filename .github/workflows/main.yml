name: Build Kernel SD8150

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            clang lld llvm \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64

          mkdir -p out

          make O=out sd8150_perf_defconfig

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Prepare Image
        run: |
          mkdir -p release
          cp out/arch/arm64/boot/Image* release/ || true
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kernel Build ${{ github.run_number }}
          body: |
            Auto-built kernel image for SD8150
            Defconfig: sd8150_perf_defconfig
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
